      _compat.$argument: Weather.Replace="{{{Weather.Replace}}}"&Weather.Provider="{{{Weather.Provider}}}"&NextHour.Fill="{{{NextHour.Fill}}}"&NextHour.Provider="{{{NextHour.Provider}}}"&AirQuality.Current.Fill="{{{AirQuality.Current.Fill}}}"&AirQuality.Current.Pollutants.Provider="{{{AirQuality.Current.Pollutants.Provider}}}"&AirQuality.Current.Pollutants.Units.Replace="{{{AirQuality.Current.Pollutants.Units.Replace}}}"&AirQuality.Current.Pollutants.Units.Mode="{{{AirQuality.Current.Pollutants.Units.Mode}}}"&AirQuality.Current.Index.Replace="{{{AirQuality.Current.Index.Replace}}}"&AirQuality.Current.Index.Provider="{{{AirQuality.Current.Index.Provider}}}"&AirQuality.Current.Index.ForceCNPrimaryPollutants="{{{AirQuality.Current.Index.ForceCNPrimaryPollutants}}}"&AirQuality.Comparison.Fill="{{{AirQuality.Comparison.Fill}}}"&AirQuality.Comparison.ReplaceWhenCurrentChange="{{{AirQuality.Comparison.ReplaceWhenCurrentChange}}}"&AirQuality.Comparison.Yesterday.PollutantsProvider="{{{AirQuality.Comparison.Yesterday.PollutantsProvider}}}"&AirQuality.Comparison.Yesterday.IndexProvider="{{{AirQuality.Comparison.Yesterday.IndexProvider}}}"&AirQuality.Calculate.Algorithm="{{{AirQuality.Calculate.Algorithm}}}"&AirQuality.Calculate.AllowOverRange="{{{AirQuality.Calculate.AllowOverRange}}}"&API.ColorfulClouds.Token="{{{API.ColorfulClouds.Token}}}"&API.QWeather.Host="{{{API.QWeather.Host}}}"&API.QWeather.Token="{{{API.QWeather.Token}}}"&API.WAQI.Token="{{{API.WAQI.Token}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
