name: ' iRingo: 🌤 WeatherKit'
description: |-
  iOS 18–27 & macOS 15+ & watchOS 11+
  1.解锁全部天气功能
  2.替换空气质量数据
  3.添加下一小时降水数据
  4.添加天气数据
  5.保留 iOS 27 新增天气产品
compat_arguments:
  Weather.Replace: CN
  Weather.Provider: ColorfulClouds
  NextHour.Fill: CN|HK|MO|TW|IT|LT|MT|FR|SK|NO|BY|IS|CZ|SI|DE|ES|UA|DK|PL|FI|SE|HR|RU|RO|PT|EE|RS|AT|GR|HU|FJ|GU|MH|NC|TR|BH|SA|ID|IR|SG|OM|PH|IN|KH|CY|MY|VN|KW|TH|KR|KP|CA|BS|KY|MX|PA|MQ|CU|BM|PR|CW|GP|NI|BR|GF|CO|GY|PY|AR
  NextHour.Provider: ColorfulClouds
  AirQuality.Current.Fill: CN|HK|MO
  AirQuality.Current.Pollutants.Provider: ColorfulClouds
  AirQuality.Current.Pollutants.Units.Replace: ''
  AirQuality.Current.Pollutants.Units.Mode: Scale
  AirQuality.Current.Index.Replace: HJ6332012
  AirQuality.Current.Index.Provider: Calculate
  AirQuality.Current.Index.ForceCNPrimaryPollutants: 'true'
  AirQuality.Comparison.Fill: CN|HK|MO
  AirQuality.Comparison.ReplaceWhenCurrentChange: 'false'
  AirQuality.Comparison.Yesterday.PollutantsProvider: QWeather
  AirQuality.Comparison.Yesterday.IndexProvider: ColorfulCloudsUS
  AirQuality.Calculate.Algorithm: EU_EAQI
  AirQuality.Calculate.AllowOverRange: 'true'
  API.ColorfulClouds.Token: ''
  API.QWeather.Host: devapi.qweather.com
  API.QWeather.Token: ''
  API.WAQI.Token: ''
  Storage: Argument
  LogLevel: WARN
compat_arguments_desc: |
  Weather.Replace: [天气] 替换范围
  正则表达式，只替换指定地区的天气。

  Weather.Provider: [天气] 数据源
      ├ WeatherKit: WeatherKit（不替换）
      ├ ColorfulClouds: 彩云天气
      └ QWeather: 和风天气
  使用选定的数据源替换天气数据。

  NextHour.Fill: [未来一小时降水强度] 填补地区
  正则表达式，只填补指定地区的未来一小时降水强度。

  NextHour.Provider: [未来一小时降水强度] 数据源
      ├ WeatherKit: WeatherKit（不添加）
      ├ ColorfulClouds: 彩云天气
      └ QWeather: 和风天气
  使用选定的数据源填充未来一小时降水强度的数据。

  AirQuality.Current.Fill: [空气质量 - 今日] 填补地区
  正则表达式，只填补指定地区的今日空气质量数据。

  AirQuality.Current.Pollutants.Provider: [今日污染物] 数据源
      ├ ColorfulClouds: 彩云天气
      └ QWeather: 和风天气
  使用选定的数据源填补污染物数据。

  AirQuality.Current.Pollutants.Units.Replace: [今日污染物 - 单位转换] 替换目标
      ├ EPA_NowCast: 美国AQI（EPA_NowCast）
      ├ EU.EAQI: 欧盟EAQI（EU.EAQI）
      ├ HJ6332012: 中国AQI（HJ6332012）
      └ UBA: 德国LQI（UBA）
  转换污染物的单位，方便与空气质量标准比对。单位转换会产生小数，有略微精度损失，且小数部分可能会被省略。

  AirQuality.Current.Pollutants.Units.Mode: [今日污染物 - 单位转换] 模式
      ├ Scale: 与空气质量标准的要求相同
      ├ ugm3: 除非标准要求，都转为µg/m³
      ├ EU_ppb: 除非标准要求，都转为欧盟ppb
      ├ US_ppb: 除非标准要求，都转为美标ppb
      ├ Force_ugm3: µg/m³
      ├ Force_EU_ppb: 欧盟ppb
      └ Force_US_ppb: 美标ppb
  污染物单位的转换目标。

  AirQuality.Current.Index.Replace: [今日空气指数] 替换目标
      ├ HJ6332012: 中国AQI（HJ6332012）
      ├ IE.AQIH: 爱尔兰AQIH（IE.AQIH）
      ├ AT.AQI: 奥地利AQI（AT.AQI）
      ├ BE.BelAQI: 比利时BelAQI（BE.BelAQI）
      ├ UBA: 德国LQI（UBA）
      ├ FR.ATMO: 法国IQA（FR.ATMO）
      ├ KR.CAI: 韩国CAI（KR.CAI）
      ├ CA.AQHI: 加拿大AQHI（CA.AQHI）
      ├ CZ.AQI: 捷克AQI（CZ.AQI）
      ├ NL.LKI: 荷兰LKI（NL.LKI）
      ├ EPA_NowCast: 美国AQI（EPA_NowCast）
      ├ ICARS: 墨西哥ICARS（ICARS）
      ├ EU.EAQI: 欧盟EAQI（EU.EAQI）
      ├ CH.KBI: 瑞士KBI（CH.KBI）
      ├ ES.MITECO: 西班牙ICA（ES.MITECO）
      ├ SG.NEA: 新加坡PSI（SG.NEA）
      ├ NAQI: 印度NAQI（NAQI）
      └ DAQI: 英国DAQI（DAQI）
  替换指定标准的空气质量指数。

  AirQuality.Current.Index.Provider: [今日空气指数] 数据源
      ├ Calculate: iRingo内置算法
      ├ ColorfulCloudsUS: 彩云天气（美标，18年9月版）
      ├ ColorfulCloudsCN: 彩云天气（国标，12年2月版）
      └ QWeather: 和风天气（国标，12年2月版）
  使用选定的数据源填补和替换空气质量指数。

  AirQuality.Current.Index.ForceCNPrimaryPollutants: [今日空气指数] 强制主要污染物
  忽略国标（HJ 633—2012）的AQI > 50规定，始终将IAQI最大的空气污染物作为主要污染物。

  AirQuality.Comparison.Fill: [空气质量 - 对比昨日] 填补地区
  正则表达式，只填补指定地区的对比昨日数据。

  AirQuality.Comparison.ReplaceWhenCurrentChange: [空气质量 - 对比昨日] 变化时替换
  即使已有对比昨日数据，当今日空气质量指数发生变化时，替换对比昨日数据。

  AirQuality.Comparison.Yesterday.PollutantsProvider: [昨日污染物] 数据源
      └ QWeather: 和风天气
  为iRingo内置算法提供污染物数据，计算出昨日的空气质量指数。

  AirQuality.Comparison.Yesterday.IndexProvider: [昨日空气指数] 数据源
      ├ Calculate: iRingo内置算法
      ├ ColorfulCloudsUS: 彩云天气（美标，18年9月版）
      ├ ColorfulCloudsCN: 彩云天气（国标，12年2月版）
      └ QWeather: 和风天气（国标，12年2月版）
  用来和今日空气质量指数对比的数据。

  AirQuality.Calculate.Algorithm: [iRingo内置算法] 算法
      ├ None: 不转换
      ├ UBA: 德国LQI（FB001846）
      ├ EU_EAQI: 欧盟EAQI（ETC HE Report 2024/17）
      ├ WAQI_InstantCast_US: 美标InstantCast（EPA-454/B-24-002）
      ├ WAQI_InstantCast_CN: 国标InstantCast（HJ 633—2012）
      └ WAQI_InstantCast_CN_25_DRAFT: 国标InstantCast（HJ 633 2025年草案）
  使用内置算法，通过污染物数据本地计算空气指数。InstantCast源自于WAQI，美标版本使用了WAQI的臭氧标准。

  AirQuality.Calculate.AllowOverRange: [iRingo内置算法] 允许指数超标
  允许美标和国标的指数超过500。超过500时，指示颜色的小圆点会消失。

  API.ColorfulClouds.Token: [API] 彩云天气令牌
  彩云天气 API 令牌

  API.QWeather.Host: [API] 和风天气主机
  和风天气 API 使用的主机名

  API.QWeather.Token: [API] 和风天气令牌
  和风天气 API 令牌

  API.WAQI.Token: [API] WAQI 令牌
  WAQI API 令牌，填写此字段将自动使用WAQI高级API

  Storage: [储存] 配置类型
      ├ Argument: 优先使用插件选项与模块参数等，由 $argument 传入的配置，$argument 不包含的设置项由 PersistentStore (BoxJs) 提供
      ├ PersistentStore: 只使用来自 BoxJs 等，由 $persistentStore 提供的配置
      └ database: 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用
  选择要使用的配置类型。未设置此选项或不通过此选项的旧版本的配置顺序依旧是 $persistentStore (BoxJs) > $argument > database。

  LogLevel: [调试] 日志等级
      ├ OFF: 关闭
      ├ ERROR: ❌ 错误
      ├ WARN: ⚠️ 警告
      ├ INFO: ℹ️ 信息
      ├ DEBUG: 🅱️ 调试
      └ ALL: 全部
  选择脚本日志的输出等级，低于所选等级的日志将全部输出。
open_url: http://boxjs.com/#/app/iRingo.WeatherKit
author: VirgilClyne[https://github.com/VirgilClyne],WordlessEcho[https://github.com/WordlessEcho],001[https://github.com/001ProMax]
homepage: https://NSRingo.github.io/guide/Weather/weather-kit
icon: https://developer.apple.com/assets/elements/icons/weatherkit/weatherkit-128x128.png
dns: {}
rules:
- domain:
    match: weather-analytics-events.apple.com
    policy: REJECT-DROP
- domain_suffix:
    match: tthr.apple.com
    policy: REJECT-DROP
- domain:
    match: tether.edge.apple
    policy: REJECT-DROP
- and:
    match:
    - or:
        match:
        - asn:
            match: '714'
            no_resolve: true
        - asn:
            match: '6185'
            no_resolve: true
    - protocol:
        match: QUIC
    policy: REJECT-DROP
